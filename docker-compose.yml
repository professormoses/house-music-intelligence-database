services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: hmid
      POSTGRES_PASSWORD: hmid
      POSTGRES_DB: hmid
    ports:
      - '5432:5432'
    volumes:
      - hmid_pg:/var/lib/postgresql/data

  redis:
    image: redis:7
    ports:
      - '6379:6379'

  app:
    build: .
    depends_on:
      - db
    environment:
      # To use Postgres, also switch the provider in prisma/schema.prisma to "postgresql".
      DATABASE_URL: postgresql://hmid:hmid@db:5432/hmid?schema=public
      SITE_URL: http://localhost:3000
      ADMIN_TOKEN: change-me
      MUSICBRAINZ_CONTACT: you@example.com
    ports:
      - '3000:3000'
    command: sh -c "npx prisma db push && npm run db:seed && npm run start"

volumes:
  hmid_pg:
